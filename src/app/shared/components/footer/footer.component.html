<footer class="footer">
    <div class="container footer__container">
        <div class="footer__content">
            <div class="footer__col footer__col--forMobile">
                @if (0) {
                    <button
                        class="blueBtn blueBtn--white"
                        (click)="qrModalOrTelegram()"
                    >
                        <svg class="surpriseIcon" icon="presentBlue"></svg>
                        <span>Получить подарок</span>
                    </button>
                } @else if (mobileDetectService.osDevice || 1) {
                    <button class="footer__download downloadApp" (click)="openQRModalAdvanced()" type="button">
                        <div class="downloadApp__title">Скачайте<br />приложение</div>
                        <div class="downloadApp__icon">
                            <img class="forLightTheme" [src]="mobileDetectService?.mobileStoreIconSrc()" alt="store" />
                            <img class="forDarkTheme" [src]="mobileDetectService?.mobileStoreIconSrc(true)" alt="store" />
                            <picture class="forSystemTheme">
                                <source [srcset]="mobileDetectService?.mobileStoreIconSrc()" media="(prefers-color-scheme: light)">
                                <source [srcset]="mobileDetectService?.mobileStoreIconSrc(true)" media="(prefers-color-scheme: dark)">
                                <img [src]="mobileDetectService?.mobileStoreIconSrc()" alt="store" />
                            </picture>
                        </div>
                    </button>
                } @else {
                    <button class="btnInFooter" (click)="openQRModalAdvanced()" type="button">
                        Скачайте приложение
                    </button>
                }
                <div class="footer__links">
                    <div class="footer__nav">
                        <a class="btnInFooter" routerLink="/help">{{helpBtnName}}</a>
                        <a class="btnInFooter" routerLink="/legal-info">Правовая информация</a>
                    </div>
                    <div class="footer__socialNetworks">
                        <a href="https://instagram.com/dazzlink.asia" target="_blank" class="btnInFooter">Instagram</a>
                        <a href="https://t.me/dazzlink" target="_blank" class="btnInFooter">Telegram</a>
                    </div>
                </div>
            </div>
            <div class="footer__col footer__col--forDesktop">
                <div class="footer__btns">
                    @if (0) {
                        <button class="btnInFooter"
                            (click)="qrModalOrTelegram()"
                            type="button"
                        >
                            Получить подарок
                        </button>
                    } @else {
                        <button class="btnInFooter"
                            (click)="openQRModalAdvanced()"
                            type="button"
                        >
                            Скачайте приложение
                        </button>
                    }
                    <!-- <button class="btnInFooter" type="button" (click)="showQrCodeModal.set(!showQrCodeModal())">My</button> -->
                    <a class="btnInFooter" routerLink="/help">Помощь</a>
                    <a class="btnInFooter" routerLink="/legal-info">Правовая информация</a>
                    <a href="https://instagram.com/dazzlink.asia" target="_blank" class="btnInFooter">Instagram</a>
                    <a href="https://t.me/dazzlink" target="_blank" class="btnInFooter">Telegram</a>
                </div>
            </div>
            <div class="footer__col">
                <div class="company" (click)="clickByCompanyBlock()">{{curYear}} ©&nbsp;DAZZLINK&nbsp;CO,&nbsp;MChJ. Все&nbsp;права&nbsp;защищены</div>
            </div>
        </div>
    </div>
</footer>
